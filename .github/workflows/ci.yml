# .github/workflows/ci.yml
#
# R6 (2026-08-07 team-rollout-hardening plan): every merge to main published
# without ever running the tests — H1's Windows portability regressions (R1)
# only surfaced through manual dogfooding, never through CI, because there
# was no CI. This is the net that was missing: build + typecheck + full test
# suite on both platforms the CLI actually ships to, on every PR.
#
# Each command is its own `run:` step (not chained with `&&` in one
# multi-line block) deliberately: windows-latest runners default to `pwsh`
# for `run:` steps, and a bash-style `&&` chain would behave differently (or
# fail outright) there. Separate single-command steps run identically under
# `pwsh` and `bash` since none of them use shell-specific syntax.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Los tres sistemas de la matriz de soporte. macOS entro despues que los
        # otros dos: estaba en `⚠ sin verificar` unicamente porque nadie lo habia
        # agregado, no porque hubiera algo que resolver — y `fail-fast: false`
        # arriba asegura que un fallo en uno no oculte el resultado de los demas,
        # que es como se descubre que un bug es de UNA plataforma y no del cambio.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Typecheck
        working-directory: cli
        run: npx tsc --noEmit

      # The support-matrix block is derived from an immutable registry release,
      # not from the mutable sibling checkout available to maintainers. Checking
      # out the exact public tag on every supported OS prevents documentation
      # drift from being merged as an untested assertion.
      - name: Checkout published sensor registry
        uses: actions/checkout@v4
        with:
          repository: Kodria/awm-baseline-registry
          ref: v2.0.0
          path: awm-baseline-registry

      - name: Regenerate published sensor support matrix
        working-directory: cli
        run: npx ts-node scripts/sensor-support-matrix.ts --registry-root ../awm-baseline-registry --registry-tag v2.0.0 --registry-commit c35c087a0801c0b4e69e0a4ac3eafef9ecdf37cd

      - name: Verify published sensor support matrix
        run: git diff --exit-code -- docs/support-matrix.md

      - name: Test
        working-directory: cli
        run: npx jest --runInBand

      # This is intentionally a second consumer boundary: the regular suite
      # executes this checkout, while this gate invokes the npm tarball that a
      # developer actually installs. The registry remains the immutable release
      # checked out above, never the mutable repository under test.
      - name: Install published R3 consumer
        run: npm install --prefix published-consumer --no-audit --no-fund agentic-workflow-manager@8.1.1

      - name: Accept published R3 consumer
        working-directory: cli
        env:
          AWM_PUBLISHED_CLI_ROOT: ${{ github.workspace }}/published-consumer/node_modules/agentic-workflow-manager
          AWM_PUBLISHED_CLI_VERSION: 8.1.1
          AWM_PUBLISHED_REGISTRY_ROOT: ${{ github.workspace }}/awm-baseline-registry
        run: npx jest tests/integration/published-r3-acceptance.e2e.test.ts --runInBand
