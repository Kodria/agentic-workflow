# .github/workflows/release.yml
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publica)'
        type: boolean
        default: false
      # `determineBump` devuelve null cuando ningun commit desde el ultimo release es
      # feat/fix/perf ni breaking (cli/src/release/core.ts). Es lo correcto: un `chore:`
      # de docs no debe publicar a npm. Pero deja un hueco real — un cambio que altera
      # METADATA PUBLICADA del paquete y no es feat ni fix no tiene forma de llegar al
      # registro. Paso con el PR #88: corrigio `"license": "ISC"` -> `"Apache-2.0"`,
      # se mergeo como `chore(legal):`, el workflow corrio en verde y no publico nada.
      # `main` quedo correcto y npm siguio entregando ISC.
      #
      # El CLI ya sabia resolverlo (`--force major|minor|patch`, cubierto por
      # tests/release/orchestrator.test.ts); lo que faltaba era que CI pudiera
      # alcanzarlo. Ver docs/decisions.md D-022.
      bump:
        description: 'Forzar un release aunque no haya commits releasables (metadata publicada)'
        type: choice
        default: 'auto'
        options: ['auto', 'patch', 'minor', 'major']

permissions:
  contents: write
  id-token: write   # OIDC para npm Trusted Publisher

# Los releases se SERIALIZAN. Dos corridas concurrentes ya rompieron una vez:
# mergear un PR mientras el release del anterior estaba en vuelo dejo a la segunda
# corrida adelantando `main`, y la primera murio en `git push` con non-fast-forward
# DESPUES de haber publicado a npm. Resultado: la 4.0.1 existe en npm y no existe en
# git — sin tag y sin entrada de CHANGELOG. Ver docs/decisions.md D-009.
#
# `cancel-in-progress: false` es lo importante: cancelar un release a mitad de camino
# es justo el modo de falla que se quiere evitar. La segunda corrida ESPERA.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # El gate del release, en las TRES plataformas.
  #
  # Antes el release corria sus tests solo en ubuntu-latest y no dependia de la matriz
  # `ci` (que es un workflow aparte, disparado por PR). Consecuencia: un fallo exclusivo
  # de Windows o macOS publicaba a npm igual. Paso con la v3.13.7 — salio con la matriz
  # en rojo. CLAUDE.md afirmaba "CI gates the release on the tests passing", y era cierto
  # para una sola plataforma. Ver docs/decisions.md, D-005.
  #
  # `fail-fast: false` a proposito: si Windows falla se quiere igual el resultado de
  # macOS y Linux, porque es la diferencia entre "bug de una plataforma" y "el cambio
  # esta roto".
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          # Keep the release artifact compiler on VS2022: node-gyp 11.5 does
          # not yet discover the VS2026 image behind windows-latest.
          - os: windows-2022
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read      # este job no publica: no necesita write ni OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar y build
        working-directory: cli
        run: |
          npm ci
          npm run native:build
          npm run build

      - name: Verify native build artifact
        working-directory: cli
        run: >-
          node -e "const fs=require('fs'); const path=require('path'); const file=path.join('prebuilds', '${{ matrix.target }}', 'secure_fs.node'); if (!fs.existsSync(file)) throw new Error('native build artifact is missing: ' + file);"

      - name: Upload native secure-fs artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-fs-${{ matrix.target }}
          path: cli/prebuilds/${{ matrix.target }}/secure_fs.node
          if-no-files-found: error

      - name: Tests
        working-directory: cli
        run: npx jest --runInBand

  release:
    needs: test          # rojo en CUALQUIER plataforma no publica
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release-result.outputs.published }}
      version: ${{ steps.release-result.outputs.version }}
      registry_commit: ${{ steps.registry-provenance.outputs.registry_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historia completa + tags para el bump
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Sin registry-url: evita que setup-node escriba un .npmrc con _authToken
          # placeholder que hace que npm prefiera auth por token sobre OIDC.

      # Esta verificación es ANTES de publicar: el release anterior publicó el
      # paquete y recién después descubrió que una variable administrativa no
      # existía. El tag publicado es la frontera inmutable, por lo que no hace
      # falta depender de una variable de Actions que el maintainer no puede
      # inspeccionar ni reparar desde el flujo normal.
      - name: Resolve immutable Task 7 registry commit
        id: registry-provenance
        env:
          REGISTRY_TAG: v3.4.0
          REGISTRY_REMOTE: https://github.com/Kodria/awm-baseline-registry.git
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_COMMIT="$(git ls-remote --exit-code "$REGISTRY_REMOTE" "refs/tags/${REGISTRY_TAG}^{}" | awk '{print $1}')"
          if [[ ! "$REGISTRY_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "${REGISTRY_TAG} must resolve to one full peeled commit SHA" >&2
            exit 1
          fi
          echo "registry_commit=$REGISTRY_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Actualizar npm (OIDC Trusted Publisher requiere >=11.5.1)
        run: npm install -g npm@latest

      - name: Configurar identidad git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Instalar y build
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Assemble native release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: secure-fs-*
          path: cli/native-artifacts

      - name: Copy native release artifacts into npm package
        working-directory: cli
        run: node scripts/assemble-native-artifacts.js "${{ github.workspace }}/cli/native-artifacts"

      - name: Verify universal native npm package
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          npm run native:package-check
          TARBALL="$(npm pack --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const packed = JSON.parse(input); const item = Array.isArray(packed) ? packed[0] : Object.values(packed)[0]; if (!item || typeof item !== "object" || typeof item.filename !== "string") throw new Error("npm pack returned no tarball filename"); console.log(item.filename); });')"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            tar -tzf "$TARBALL" | grep -Fx "package/prebuilds/$target/secure_fs.node"
          done
          rm "$TARBALL"

      # Sin paso de tests aca: `needs: test` ya los corrio en las tres plataformas.
      # Repetirlos en ubuntu seria correr por cuarta vez lo que ya paso, y daria la
      # impresion de que el gate vive en este job cuando vive en la matriz.

      # `bump` solo existe en workflow_dispatch: un push a main nunca fuerza nada, sigue
      # decidiendo `determineBump`. El valor 'auto' es el default explicito y no agrega
      # flag, de modo que el camino normal es byte-identico al anterior.
      - name: Release
        id: release-result
        working-directory: cli
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '--dry-run' || '' }}
          FORCE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'auto' && format('--force {0}', inputs.bump) || '' }}
        run: |
          result="$(node dist/src/release/index.js $DRY_RUN $FORCE_BUMP)"
          printf '%s\n' "$result"
          if [[ "$result" =~ Publicado\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # This is intentionally after `release`, not a replacement for its test
  # gate.  It downloads npm and git artifacts into a clean consumer on each
  # supported native platform, so no workspace path, file: dependency, or
  # mutable branch participates in the final acceptance boundary.
  published-doctor-evidence:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        working-directory: cli
        run: npm ci
      - name: Accept published dashboard and evidence artifacts
        working-directory: cli
        env:
          AWM_PUBLISHED_CLI_VERSION: ${{ needs.release.outputs.version }}
          AWM_PUBLISHED_REGISTRY_TAG: v3.4.0
          AWM_PUBLISHED_REGISTRY_COMMIT: ${{ needs.release.outputs.registry_commit }}
          AWM_PUBLISHED_REGISTRY_REMOTE: https://github.com/Kodria/awm-baseline-registry.git
        run: npx jest tests/integration/published-doctor-evidence.e2e.test.ts --runInBand
