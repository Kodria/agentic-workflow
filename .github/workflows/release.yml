# .github/workflows/release.yml
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publica)'
        type: boolean
        default: false
      # `determineBump` devuelve null cuando ningun commit desde el ultimo release es
      # feat/fix/perf ni breaking (cli/src/release/core.ts). Es lo correcto: un `chore:`
      # de docs no debe publicar a npm. Pero deja un hueco real — un cambio que altera
      # METADATA PUBLICADA del paquete y no es feat ni fix no tiene forma de llegar al
      # registro. Paso con el PR #88: corrigio `"license": "ISC"` -> `"Apache-2.0"`,
      # se mergeo como `chore(legal):`, el workflow corrio en verde y no publico nada.
      # `main` quedo correcto y npm siguio entregando ISC.
      #
      # El CLI ya sabia resolverlo (`--force major|minor|patch`, cubierto por
      # tests/release/orchestrator.test.ts); lo que faltaba era que CI pudiera
      # alcanzarlo. Ver docs/decisions.md D-022.
      bump:
        description: 'Forzar un release aunque no haya commits releasables (metadata publicada)'
        type: choice
        default: 'auto'
        options: ['auto', 'patch', 'minor', 'major']

permissions:
  contents: write
  id-token: write   # OIDC para npm Trusted Publisher

# Los releases se SERIALIZAN. Dos corridas concurrentes ya rompieron una vez:
# mergear un PR mientras el release del anterior estaba en vuelo dejo a la segunda
# corrida adelantando `main`, y la primera murio en `git push` con non-fast-forward
# DESPUES de haber publicado a npm. Resultado: la 4.0.1 existe en npm y no existe en
# git — sin tag y sin entrada de CHANGELOG. Ver docs/decisions.md D-009.
#
# `cancel-in-progress: false` es lo importante: cancelar un release a mitad de camino
# es justo el modo de falla que se quiere evitar. La segunda corrida ESPERA.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # El gate del release, en las TRES plataformas.
  #
  # Antes el release corria sus tests solo en ubuntu-latest y no dependia de la matriz
  # `ci` (que es un workflow aparte, disparado por PR). Consecuencia: un fallo exclusivo
  # de Windows o macOS publicaba a npm igual. Paso con la v3.13.7 — salio con la matriz
  # en rojo. CLAUDE.md afirmaba "CI gates the release on the tests passing", y era cierto
  # para una sola plataforma. Ver docs/decisions.md, D-005.
  #
  # `fail-fast: false` a proposito: si Windows falla se quiere igual el resultado de
  # macOS y Linux, porque es la diferencia entre "bug de una plataforma" y "el cambio
  # esta roto".
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read      # este job no publica: no necesita write ni OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar y build
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Tests
        working-directory: cli
        run: npx jest --runInBand

  release:
    needs: test          # rojo en CUALQUIER plataforma no publica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historia completa + tags para el bump
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Sin registry-url: evita que setup-node escriba un .npmrc con _authToken
          # placeholder que hace que npm prefiera auth por token sobre OIDC.

      - name: Actualizar npm (OIDC Trusted Publisher requiere >=11.5.1)
        run: npm install -g npm@latest

      - name: Configurar identidad git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Instalar y build
        working-directory: cli
        run: |
          npm ci
          npm run build

      # Sin paso de tests aca: `needs: test` ya los corrio en las tres plataformas.
      # Repetirlos en ubuntu seria correr por cuarta vez lo que ya paso, y daria la
      # impresion de que el gate vive en este job cuando vive en la matriz.

      # `bump` solo existe en workflow_dispatch: un push a main nunca fuerza nada, sigue
      # decidiendo `determineBump`. El valor 'auto' es el default explicito y no agrega
      # flag, de modo que el camino normal es byte-identico al anterior.
      - name: Release
        working-directory: cli
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '--dry-run' || '' }}
          FORCE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'auto' && format('--force {0}', inputs.bump) || '' }}
        run: |
          node dist/src/release/index.js $DRY_RUN $FORCE_BUMP

  # This is intentionally after `release`, not a replacement for its test
  # gate.  It downloads npm and git artifacts into a clean consumer on each
  # supported native platform, so no workspace path, file: dependency, or
  # mutable branch participates in the final acceptance boundary.
  published-doctor-evidence:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        working-directory: cli
        run: npm ci
      - name: Resolve exact published CLI version
        id: published-cli
        shell: bash
        run: echo "version=$(npm view agentic-workflow-manager version)" >> "$GITHUB_OUTPUT"
      - name: Accept published dashboard and evidence artifacts
        working-directory: cli
        env:
          AWM_PUBLISHED_CLI_VERSION: ${{ steps.published-cli.outputs.version }}
          AWM_PUBLISHED_REGISTRY_TAG: v3.2.0
          AWM_PUBLISHED_REGISTRY_REMOTE: https://github.com/Kodria/awm-baseline-registry.git
        run: npx jest tests/integration/published-doctor-evidence.e2e.test.ts --runInBand
